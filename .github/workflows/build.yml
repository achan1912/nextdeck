name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Compile Flutter iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App for Device (Unsigned)
        run: |
          # Explicitly target ios device build to force generation of iphoneos/Runner.app
          flutter build ios --release --no-codesign --sdk ios

      - name: Package Runner.app into an Unsigned IPA
        run: |
          # Create target ipa directory
          mkdir -p build/ios/ipa
          
          # Navigate to the compiled iphoneos folder
          cd build/ios/iphoneos
          
          # Create the Payload directory required for IPA structure
          mkdir Payload
          cp -r Runner.app Payload/
          
          # Compress Payload into an .ipa file
          zip -r ../ipa/nextdeck-unsigned.ipa Payload
          
          # Return to root workspace
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdeck-unsigned-ipa
          path: build/ios/ipa/*.ipa
