name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Compile Flutter iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Locate and Package Runner.app into an Unsigned IPA
        run: |
          echo "Searching for compiled Runner.app..."
          
          # Dynamically find Runner.app anywhere inside build/ios to handle version differences
          APP_PATH=$(find build/ios -name "Runner.app" -type d | grep -v "iphonesimulator" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found in device build paths. Checking all directories:"
            find build/ios -name "Runner.app" -type d
            exit 1
          fi
          
          echo "Found Runner.app at: $APP_PATH"
          
          # Create target ipa directory structure
          mkdir -p build/ios/ipa/Payload
          
          # Copy the app bundle into Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          
          # Compress into IPA
          cd build/ios/ipa
          zip -r nextdeck-unsigned.ipa Payload
          cd ../../..
          
          echo "Successfully created unsigned IPA!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdeck-unsigned-ipa
          path: build/ios/ipa/*.ipa
