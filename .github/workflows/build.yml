name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Compile Flutter iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing Requirements
        run: |
          # Patch Xcode project settings to bypass developer account requirements
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGNING_STYLE = Automatic;/CODE_SIGNING_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGNING_IDENTITY = "Apple Development";/CODE_SIGNING_IDENTITY = "";/g' "$PBXPROJ"
          echo "Successfully disabled code signing constraints."
        shell: bash

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Runner.app into an Unsigned IPA
        run: |
          # Locate the compiled app bundle
          APP_PATH=$(find build/ios -name "Runner.app" -type d | grep -v "iphonesimulator" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app build output missing."
            exit 1
          fi
          
          echo "Found binary at: $APP_PATH"
          
          # Bundle into IPA structure
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          
          cd build/ios/ipa
          zip -r nextdeck-unsigned.ipa Payload
          cd ../../..
          
          echo "Verification: IPA successfully created at build/ios/ipa/nextdeck-unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdeck-unsigned-ipa
          path: build/ios/ipa/*.ipa
